name: Publier un document Word (.docx)
description: Téléversez un document Word pour créer automatiquement une page d'activité ou un procès-verbal sur le site.
title: "[Publication] : "
body:
  - type: markdown
    attributes:
      value: |
        ### 📄 Publier un document Word
        Remplissez ce formulaire et joignez votre document `.docx`. La page est créée et le site mis à jour automatiquement en quelques minutes.

        **Titre de l'issue** : il devient le titre de la page (remplacez « [Publication] : » par exemple par « Stand de l'Escalade 2026 »).

        Pour corriger la page ensuite, modifiez simplement cette issue (bouton « Edit ») : la page est recréée.

  - type: dropdown
    id: doc_type
    attributes:
      label: Type de document
      description: Une activité (à venir ou passée) ou le procès-verbal d'une réunion.
      options:
        - "Activité"
        - "Procès-verbal / Compte-rendu de réunion"
    validations:
      required: true

  - type: input
    id: event_date
    attributes:
      label: Date
      description: "Date de l'activité ou de la réunion, au format JJ.MM.AAAA ou AAAA-MM-JJ."
      placeholder: "11.12.2026"
    validations:
      required: true

  - type: input
    id: event_time
    attributes:
      label: Heure
      description: Facultatif.
      placeholder: "16h00"

  - type: input
    id: event_location
    attributes:
      label: Lieu
      description: Facultatif.
      placeholder: "Préau du CO des Voirets"

  - type: input
    id: event_address
    attributes:
      label: Adresse
      description: "Facultatif : rue, numéro, NPA et localité. Elle aide les moteurs de recherche et les agendas à situer l'activité."
      placeholder: "Chemin des Voirets 22, 1228 Plan-les-Ouates"

  - type: textarea
    id: summary
    attributes:
      label: Résumé
      description: "Facultatif : une ou deux phrases affichées dans la liste des activités. Sans résumé, le premier paragraphe du document est utilisé."

  - type: textarea
    id: doc_attachment
    attributes:
      label: Document Word (.docx)
      description: Glissez-déposez ici votre fichier .docx.
      placeholder: Glissez votre fichier .docx ici...
    validations:
      required: true
