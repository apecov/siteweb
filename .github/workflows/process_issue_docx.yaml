name: Process Word Document from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  convert_docx:
    name: Convert attached DOCX to Markdown
    runs-on: ubuntu-latest
    # Only issues from the issue template (label "document") opened by people
    # with write access to the repository; anyone else could otherwise publish
    # to the site by opening an issue.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'document') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Convert the attached document
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/process-issue-docx.mjs --event-path "$GITHUB_EVENT_PATH"

      # Issue-controlled values go through env vars, never ${{ }} inside the
      # script, so a crafted issue title cannot inject shell commands.
      - name: Commit and push the generated page
        id: commit
        if: steps.process.outputs.created_file != ''
        env:
          CREATED_FILE: ${{ steps.process.outputs.created_file }}
          DOC_TYPE: ${{ steps.process.outputs.doc_type }}
          DOC_TITLE: ${{ steps.process.outputs.doc_title }}
          ISSUE_NUM: ${{ steps.process.outputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$CREATED_FILE"
          if [ -d static/images/documents ]; then git add -- static/images/documents; fi
          # Re-running on an already published issue (e.g. when a label is
          # added) produces the same file: nothing to commit, nothing to do.
          if git diff --cached --quiet; then
            echo "Page already up to date."
            exit 0
          fi
          git commit -m "Publication $DOC_TYPE : $DOC_TITLE (issue #$ISSUE_NUM)"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start
      # the deployment explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"

      - name: Comment on and close the issue
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.process.outputs.issue_number }}
          CREATED_FILE: ${{ steps.process.outputs.created_file }}
          DOC_TYPE: ${{ steps.process.outputs.doc_type }}
        run: |
          gh issue close "$ISSUE_NUM" --comment "✅ **Document converti et publié avec succès !**

          Le document Word a été converti en Markdown et intégré au site :
          - **Fichier créé :** \`$CREATED_FILE\`
          - **Catégorie :** \`$DOC_TYPE\`

          Le site sera mis à jour automatiquement d'ici quelques minutes."
