name: Process Word Document from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  convert_docx:
    name: Convert attached DOCX to Markdown
    runs-on: ubuntu-latest
    # Run only if the issue has relevant labels or default issue submission
    if: github.event.issue.state == 'open'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DOCX processor script
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/process_issue_docx.py --event-path "$GITHUB_EVENT_PATH"

      - name: Commit and push generated Markdown page
        if: steps.process.outputs.created_file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.process.outputs.created_file }}"
          git commit -m "Auto-publish ${{ steps.process.outputs.doc_type }}: ${{ steps.process.outputs.doc_title }} (Issue #${{ steps.process.outputs.issue_number }})"
          git push origin HEAD:${{ github.ref_name || 'main' }}

      - name: Comment on issue with publication confirmation
        if: steps.process.outputs.created_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.process.outputs.issue_number }}
          DOC_FILE: ${{ steps.process.outputs.created_file }}
          DOC_TYPE: ${{ steps.process.outputs.doc_type }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "✅ **Document converti et publié avec succès !**

          Le document Word a été converti en Markdown et intégré dans le site :
          - **Fichier créé :** \`$DOC_FILE\`
          - **Catégorie :** \`$DOC_TYPE\`

          Le site sera automatiquement mis à jour via le déploiement GitHub Pages."
