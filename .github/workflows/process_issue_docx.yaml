name: Publish a Word document or an activity idea from an issue

# Issues created with the "Publier un document Word (.docx)" form become an
# activity page (content/evenements/) or a PV (content/pv/); those created with
# the "Proposer une activité en projet" form become an activity « en projet ».
# Editing the issue while it is open recreates the page.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write
  pages: read

# One publication at a time, so two issues never race to push.
concurrency:
  group: publish-docx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only issues made with one of the forms (recognised by one of their fields).
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.body, '### Document Word (.docx)') ||
       contains(github.event.issue.body, '### Période envisagée'))
    steps:
      # Anyone can open an issue on a public repository: only people with
      # write access may publish to the site. (author_association is not
      # reliable for organisation members with private membership, so ask
      # the API.)
      - name: Check that the author may publish
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission || echo none)
          echo "permission of $AUTHOR: $permission"
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Explain why nothing is published
        if: steps.auth.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body "ℹ️ Seuls les membres du comité ayant accès en écriture au dépôt peuvent publier sur le site. Un membre du comité peut reprendre cette proposition."

      # The latest default branch, not the commit the event saw: an earlier
      # queued run may have pushed since.
      - uses: actions/checkout@v4
        if: steps.auth.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.allowed == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.auth.outputs.allowed == 'true'
        run: npm ci

      - name: Convert the issue into a page
        id: process
        if: steps.auth.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: map previews in Thunderforest's Transport style (else ÖPNVKarte).
          THUNDERFOREST_API_KEY: ${{ secrets.THUNDERFOREST_API_KEY }}
        run: node scripts/process-issue-docx.mjs --event-path "$GITHUB_EVENT_PATH"

      # Check that the site still builds with the new page before pushing it.
      - name: Build the site
        if: steps.process.outputs.created_file != ''
        run: npm run build

      # Issue-controlled values go through env vars, never ${{ }} inside the
      # script, so a crafted issue title cannot inject shell commands.
      - name: Commit and push the page
        id: commit
        if: steps.process.outputs.created_file != ''
        env:
          DOC_TYPE: ${{ steps.process.outputs.doc_type }}
          DOC_TITLE: ${{ steps.process.outputs.doc_title }}
          ISSUE_NUM: ${{ steps.process.outputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A also stages the page and images an earlier version of this
          # issue produced and the script removed; cartes/ holds the map preview.
          git add -A -- content static/images/documents static/images/cartes
          if git diff --cached --quiet; then
            echo "Page already up to date."
            exit 0
          fi
          git commit -m "Publication $DOC_TYPE : $DOC_TITLE (issue #$ISSUE_NUM)"
          git pull --rebase origin ${{ github.event.repository.default_branch }}
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start
      # the deployment explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

      # Also runs when nothing changed (an edit that does not touch the page),
      # so that a mistyped « Remplace une activité en projet » is reported.
      - name: Report the published page
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.process.outputs.issue_number }}
          PAGE: ${{ steps.process.outputs.page }}
          CREATED_FILE: ${{ steps.process.outputs.created_file }}
          DOC_TYPE: ${{ steps.process.outputs.doc_type }}
          REPLACED_PAGE: ${{ steps.process.outputs.replaced_page }}
          REPLACED_ISSUE: ${{ steps.process.outputs.replaced_issue }}
          REPLACE_MISSING: ${{ steps.process.outputs.replace_missing }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/")
          url="${site%/}/$PAGE"
          if [ "$DOC_TYPE" = projet ]; then
            next="Quand l'activité sera planifiée, publiez son annonce avec le formulaire « Publier un document Word (.docx) » en indiquant **#$ISSUE_NUM** dans « Remplace une activité en projet » : elle prendra la place de l'idée et cette issue sera fermée."
          else
            next="Fermez l'issue quand la page vous convient."
          fi
          notes=""
          if [ -n "$REPLACED_PAGE" ]; then
            notes="

          📅 Cette activité remplace l'activité en projet ${site%/}/$REPLACED_PAGE (son adresse renvoie maintenant ici)."
          fi
          if [ -n "$REPLACE_MISSING" ]; then
            notes="

          ⚠️ Aucune activité en projet ne correspond à « $REPLACE_MISSING » : rien n'a été remplacé. Corrigez le champ « Remplace une activité en projet » (numéro de l'issue de l'idée, par ex. #12) en modifiant cette issue."
          fi
          if [ "$PUSHED" = true ]; then
            title="✅ **Page publiée !**

          La page sera en ligne d'ici quelques minutes : $url"
          else
            title="ℹ️ **La page est déjà à jour** : $url"
          fi
          gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body "$title

          Fichier : \`$CREATED_FILE\`$notes

          Pour corriger la page, modifiez cette issue (bouton « Edit ») : elle sera recréée. $next"
          # The idea is now a planned activity: close the issue that proposed it.
          if [ -n "$REPLACED_ISSUE" ] && [ "$REPLACED_ISSUE" != "$ISSUE_NUM" ] && [ "$PUSHED" = true ]; then
            state=$(gh issue view "$REPLACED_ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq .state || echo "")
            if [ "$state" = OPEN ]; then
              gh issue close "$REPLACED_ISSUE" --repo "$GITHUB_REPOSITORY" --comment "📅 Cette activité est maintenant planifiée : $url (issue #$ISSUE_NUM)."
            fi
          fi

      - name: Report a problem
        if: failure() || (steps.auth.outputs.allowed == 'true' && steps.process.outputs.created_file == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body "⚠️ **La page n'a pas pu être publiée.**

          Vérifiez les champs du formulaire (pour un document Word : qu'un fichier \`.docx\` est bien joint dans le champ « Document Word (.docx) » ; pour une activité en projet : que la description est remplie), puis modifiez l'issue pour réessayer.

          Détails techniques : $RUN_URL"
