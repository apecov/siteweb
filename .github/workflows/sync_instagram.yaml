name: Monitor Instagram Feed

on:
  schedule:
    # Run once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_feed:
    name: Sync Instagram Posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Instagram synchronizer
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_RSS_URL: ${{ secrets.INSTAGRAM_RSS_URL }}
        run: |
          python scripts/sync_instagram.py

      - name: Commit and push updated Instagram feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram_feed.json content/nouvelles/ || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(instagram): update feed cache and recent news"
            git push origin HEAD:${{ github.ref_name || 'main' }}
          else
            echo "No new Instagram posts found."
          fi
