name: Monitor Instagram Feed

on:
  schedule:
    # Once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_feed:
    name: Sync Instagram Posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run Instagram synchronizer
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_RSS_URL: ${{ secrets.INSTAGRAM_RSS_URL }}
        run: node scripts/sync-instagram.mjs

      - name: Commit, push and deploy the updated feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram_feed.json content/nouvelles/
          if git diff --cached --quiet; then
            echo "No new Instagram posts found."
            exit 0
          fi
          git commit -m "Mise à jour du flux Instagram"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
