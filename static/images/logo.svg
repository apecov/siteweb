<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008ac5"/>
      <stop offset="100%" stop-color="#006f9e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ac331"/>
      <stop offset="100%" stop-color="#7ea422"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#blueGrad)" />
  
  <!-- Stylized graduation cap & open book -->
  <path d="M 50 25 L 80 40 L 50 55 L 20 40 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 75 42 L 75 58 C 75 60 72 62 72 62" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  
  <!-- Supporting hands / open book / leaf in green -->
  <path d="M 30 58 C 30 58 40 52 50 58 C 60 52 70 58 70 58 C 70 68 50 78 50 78 C 50 78 30 68 30 58 Z" fill="url(#greenGrad)" />
  
  <!-- Subtle heart or student silhouette -->
  <circle cx="50" cy="65" r="4.5" fill="#ffffff" />
</svg>
